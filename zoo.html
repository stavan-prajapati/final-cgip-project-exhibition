<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Zoo | Kamatibaug Zoo Navigation Guide</title>
    <!-- style.css = the card + the "You reached ..." popup, aviary.css = card details (photo, audio player, fact tiles) -->
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="aviary.css?v=4">
    <link rel="stylesheet" href="zoo.css?v=4">
</head>
<body>
    <!-- The zoo map is drawn on this canvas by zoo.js (full screen, inside a wooden frame) -->
    <canvas id="zooSectionMap"></canvas>

    <!-- Wooden hanging sign with the title (same as the main map, the aviary and the cages) -->
    <header class="zoo-title">
        <div class="zoo-title-icon" aria-hidden="true">&#128062;</div>
        <div class="zoo-title-text">
            <h1>Kamatibaug Zoo</h1>
            <p>Navigation Guide</p>
        </div>
    </header>

    <a class="zoo-back" href="index.html?from=zoo">&larr; Back to Zoo Map</a>

    <!-- Animal information card (hidden until "View Details" is pressed). Filled by animal-card.js -->
    <div class="card-overlay" id="placeCard" aria-hidden="true">
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">

            <header class="card-header">
                <div class="card-icon" id="cardIcon"></div>
                <div class="card-heading">
                    <h2 id="cardTitle"></h2>
                    <p id="cardTagline"></p>
                    <span class="status-chip" id="cardStatus"></span>
                </div>
                <button class="card-close" id="cardClose" type="button" aria-label="Close">&times;</button>
            </header>

            <div class="card-body" id="cardBody">
                <figure class="card-photo">
                    <div class="photo-frame">
                        <img id="cardImg" alt="" hidden>
                        <div class="photo-fallback" id="cardFallback">
                            <span id="cardFallbackIcon"></span>
                            <small>Photo coming soon</small>
                        </div>
                    </div>
                    <figcaption id="cardCredit"></figcaption>
                </figure>

                <!-- Animal sound player. The sound file is set in data/zoo-data.js ("audio") -->
                <section class="bird-audio" id="birdAudio">
                    <button class="audio-btn" id="audioBtn" type="button" aria-label="Play the animal sound" disabled>&#9654;</button>
                    <div class="audio-info">
                        <strong>Listen to its call</strong>
                        <small id="audioNote">Audio coming soon</small>
                        <div class="audio-bar"><div class="audio-fill" id="audioFill"></div></div>
                    </div>
                </section>

                <section>
                    <h3>Quick facts</h3>
                    <ul class="facts" id="cardFacts"></ul>
                </section>

                <section class="note did-you-know" id="cardDyk">
                    <h3>Did you know?</h3>
                    <p id="cardDykText"></p>
                </section>

                <section class="note visit-tip" id="cardTipBox" hidden></section>

                <footer class="sources">
                    <h3>Sources</h3>
                    <ul id="cardSources"></ul>
                </footer>
            </div>

        </div>
    </div>

    <!-- Order matters: data first, then the card, then the map -->
    <script src="data/zoo-data.js?v=4"></script>
    <script src="animal-card.js?v=4"></script>
    <script src="zoo.js?v=4"></script>
</body>
</html>
