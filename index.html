<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kamatibaug Zoo Navigation Guide</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

    <canvas id="zooMap"></canvas>

    <!-- Wooden hanging sign with the title -->
    <header class="zoo-title">
        <div class="zoo-title-icon" aria-hidden="true">&#128062;</div>
        <div class="zoo-title-text">
            <h1>Kamatibaug Zoo</h1>
            <p>Navigation Guide</p>
        </div>
    </header>

    <!-- Information card (hidden until "View Details" is pressed). Filled by place-card.js -->
    <div class="card-overlay" id="placeCard" aria-hidden="true">
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">

            <header class="card-header">
                <div class="card-icon" id="cardIcon"></div>
                <div class="card-heading">
                    <h2 id="cardTitle"></h2>
                    <p id="cardTagline"></p>
                </div>
                <button class="card-close" id="cardClose" type="button" aria-label="Close">&times;</button>
            </header>

            <div class="card-body" id="cardBody">
                <figure class="card-photo">
                    <div class="photo-frame">
                        <img id="cardImg" alt="" hidden>
                        <div class="photo-fallback" id="cardFallback">
                            <span id="cardFallbackIcon"></span>
                            <small>Photo coming soon</small>
                        </div>
                    </div>
                    <figcaption id="cardCredit"></figcaption>
                </figure>

                <section>
                    <h3>Quick facts</h3>
                    <ul class="facts" id="cardFacts"></ul>
                </section>

                <section class="note did-you-know" id="cardDyk">
                    <h3>Did you know?</h3>
                    <p id="cardDykText"></p>
                </section>

                <section class="note visit-tip" id="cardTipBox">
                    <h3>Visitor tip</h3>
                    <p id="cardTip"></p>
                </section>

                <footer class="sources">
                    <h3>Sources</h3>
                    <ul id="cardSources"></ul>
                </footer>
            </div>

        </div>
    </div>

    <!-- Opening screen (fades away by itself, see main-map.js) -->
    <div class="splash" id="splash">
        <div class="splash-sign">
            <h1>Kamatibaug Zoo</h1>
            <p>Navigation Guide</p>
        </div>
        <div class="splash-paws" aria-hidden="true">
            <span>&#128062;</span><span>&#128062;</span><span>&#128062;</span>
        </div>
    </div>

    <!-- Order matters: data first, then the card, then the map -->
    <script src="data/places-data.js?v=7"></script>
    <script src="place-card.js?v=7"></script>
    <script src="main-map.js?v=7"></script>
</body>
</html>
